<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Similar Fractal</title>

    <script
    src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"></script>
    <script src="javascript/fractal.js"></script>
    <script src="javascript/main.js"></script>

    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <div id="panel">
      <h1>Similar Fractal</h1>
      <p class="intro">
        A square is copied by each transform below: moved, turned and
        shrunk. The copies are copied again, generation after generation.
      </p>

      <fieldset>
        <legend>Square</legend>
        <table class="controls">
          <tr class="row">
            <th>Size</th>
            <td><input class="number_slide" type="number" value="100" id="size_square"></td>
            <td><input type="range" min="0" max="1000" value="100" class="slider"></td>
          </tr>
          <tr class="row">
            <th>Repeat</th>
            <td><input class="number_slide" type="number" value="7" id="repetition"></td>
            <td class="stepper">
              <button type="button" class="step" data-target="repetition" data-step="-1" title="One generation less">&minus;</button><button type="button" class="step" data-target="repetition" data-step="1" title="One generation more">+</button>
              <input type="range" min="0" max="16" value="7" class="slider">
            </td>
          </tr>
        </table>
        <p id="limit_warning" class="limit_warning"></p>
      </fieldset>

      <fieldset>
        <legend>Display</legend>
        <label><input type="checkbox" id="only_last"> Last generation only</label><br>
        <label><input type="checkbox" id="colored"> Colour by generation</label>
        <p class="zoom">
          Zoom
          <button type="button" id="zoomOut" title="Zoom out">&minus;</button>
          <span id="zoom_level">100%</span>
          <button type="button" id="zoomIn" title="Zoom in">+</button>
          <button type="button" id="zoomFit" title="Show the whole figure">Fit</button>
        </p>
        <p class="hint">Or scroll on the figure to zoom, drag to move, double-click to fit.</p>
      </fieldset>

      <fieldset>
        <legend>Transforms</legend>
        <div class="boxes"></div>
        <p class="buttons">
          <button type="button" id="addButton">Add transform</button>
          <button type="button" id="randomButton">Random</button>
        </p>
      </fieldset>
    </div>

    <div id="figure">
      <canvas id="similar_canvas"></canvas>
      <div id="point_count"></div>
    </div>
  </body>
</html>
